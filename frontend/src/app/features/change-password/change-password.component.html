<main class="password-page">
  <section class="password-card">
    <a class="brand" href="/"><span>i</span> INCLU<span>soft</span></a>
    <p class="eyebrow">PRIMER INGRESO</p>
    <h1>Elegí tu contraseña.</h1>
    <p class="subtitle">Por seguridad, antes de ingresar al sistema tenés que reemplazar la contraseña temporal.</p>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>Contraseña temporal<input type="password" autocomplete="current-password" formControlName="currentPassword"></label>
      <label>Nueva contraseña<input type="password" autocomplete="new-password" formControlName="newPassword"><small *ngIf="form.controls.newPassword.touched && form.controls.newPassword.invalid">Usá al menos 8 caracteres.</small></label>
      <label>Repetir nueva contraseña<input type="password" autocomplete="new-password" formControlName="confirmation"></label>
      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
      <button type="submit" [disabled]="saving">{{ saving ? 'Guardando…' : 'Guardar y continuar' }} <span>→</span></button>
    </form>
  </section>
</main>
