services:
  - type: web
    name: inclusoft-api
    runtime: java
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: mvn -DskipTests package
    startCommand: java -jar target/inclusoft-api-0.1.0-SNAPSHOT.jar
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: INCLUSOFT_JWT_SECRET
        generateValue: true
      - key: INCLUSOFT_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: JDBC_DATABASE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
